function buildHistoricalBets() {
  const out = [];
  HIST_RESOLVED.forEach(([title, season, s, a, j], i) => {
    const sides = {};
    const outcomes = {};
    [["Sangeet", s], ["Adam", a], ["Josh", j]].forEach(([p, val]) => {
      if (val) {
        sides[p] = { in: true, pick: val[0], accepted: true };
        outcomes[p] = val[1];
      } else {
        sides[p] = { in: false, pick: "SKIP", accepted: true };
      }
    });
    out.push({
      id: "hist-r-" + i,
      title,
      note: "",
      createdBy: "Import",
      createdAt: new Date(season + "-09-01").toISOString(),
      season,
      stake: null,
      status: "resolved",
      sides,
      voidReason: null,
      outcomes,
      settled: true,
    });
  });
  HIST_VOID.forEach(([title, season, reason], i) => {
    const sides = {
      Sangeet: { in: true, pick: "—", accepted: true },
      Adam: { in: true, pick: "—", accepted: true },
      Josh: { in: true, pick: "—", accepted: true },
    };
    out.push({
      id: "hist-v-" + i,
      title,
      note: "",
      createdBy: "Import",
      createdAt: new Date(season + "-09-01").toISOString(),
      season,
      stake: null,
      status: "void",
      sides,
      voidReason: reason,
      outcomes: {},
      settled: false,
    });
  });
  return out;
}
function pairLoop(bet, fn) {
  const inPeople = PEOPLE.filter((p) => bet.sides[p]?.in);
  for (let i = 0; i < inPeople.length; i++) {
    for (let j = 0; j < inPeople.length; j++) {
      if (i === j) continue;
      fn(inPeople[i], inPeople[j]);
    }
  }
}

    .watch-item button { background:none; border:none; color:#5A5A5A; cursor:pointer; font-size:13px; padding:0 4px; }

    .idea-input-row { display:flex; gap:8px; margin-top:6px; }
    .idea-input-row input { flex:1; background:#0F0F0F; border:1px solid rgba(255,255,255,0.14); border-radius:5px; padding:9px 10px; color:#ECE7DA; font-family:'Inter',sans-serif; font-size:14px; }
    .idea-nearby-list { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
    .idea-nearby-row { display:flex; align-items:center; justify-content:space-between; gap:8px; background:#0F0F0F; border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:8px 10px; flex-wrap:wrap; }
    .idea-nearby-name { font-size:13.5px; }
    .idea-nearby-rank { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#6B6B6B; margin-left:6px; }
    .idea-watch-tag { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.5px; border-radius:3px; padding:1px 5px; margin-left:6px; }
    .idea-watch-tag.fire { background:rgba(255,107,74,0.18); color:#FF6B4A; }
    .idea-watch-tag.ice { background:rgba(111,211,255,0.18); color:#6FD3FF; }
  `;
  if (loading) {
    return (
      <div className="bbt">
        <style>{css}</style>
        <div className="empty">Loading the board…</div>
      </div>
    );
  }
  return (
    <div className="bbt">
      <style>{css}</style>
      <h1 className="bbt-title">
        THE <span className="accent">BOARD</span>
      </h1>
      <div className="bbt-sub">Josh · Adam · Sangeet — .5 PPR, Yahoo standard</div>
      <div className="rule" />
      <div className="scoreboard">
        {[
          ["Josh", "Adam"],
          ["Josh", "Sangeet"],
          ["Adam", "Sangeet"],
        ].map(([a, b]) => {
          const r1 = standingsAllTime[a][b];
          return (
            <div className="score-cell" key={a + b}>
              <div className="score-names">
                {a} vs {b}
              </div>
              <div className="score-record">
                <span style={{ color: PERSON_COLOR[a] }}>{r1.w}</span>
                <span style={{ color: "#5A5A5A" }}>-</span>
                <span style={{ color: PERSON_COLOR[b] }}>{r1.l}</span>
                <span style={{ color: "#5A5A5A" }}>-{r1.p}</span>
              </div>
            </div>

        })}
      </div>
      {saveError && <div className="save-err">{saveError}</div>}
      <div className="tabs">
        {[
          ["propose", "Propose", proposedBets.length],
          ["active", "Active", activeBetsAll.length],
          ["history", "History", historyBets.length],
          ["standings", "Standings", null],
          ["tally", "Who Owes Who", null],
          ["watchlist", "❄️ Ice & Fire 🔥", null],
        ].map(([key, label, count]) => (
          <button
            key={key}
            className={"tab-btn" + (tab === key ? " active" : "")}
            onClick={() => setTab(key)}

            {label}
            {count != null && <span className="count">({count})</span>}
          </button>
        ))}
      </div>
      {tab === "active" && (
        <div>
          {staleActive.length > 0 && (
            <div className="card" style={{ borderColor: "#FFD200" }}>
              <p className="bet-title" style={{ marginBottom: 4 }}>
                Wrap up {staleSeasons.join(", ")}
              </p>
              <div className="bet-note" style={{ marginBottom: 10 }}>
                {staleActive.length} bet{staleActive.length > 1 ? "s" : ""} from a season that's
                not the current one {staleActive.length > 1 ? "are" : "is"} still active. Once
                week 17 wraps, run through these and enter results.
              </div>
              <button className="btn primary" onClick={() => setStaleOnly(!staleOnly)}>
                {staleOnly ? "Show all active" : "Show just these"}
              </button>
            </div>
          )}
          {activeBets.length > 0 && (
            <div className="actions-row" style={{ marginBottom: 4 }}>
              {bulkMode ? (
                <button className="btn" onClick={exitBulkMode}>
                  Cancel bulk resolve
                </button>
              ) : (
                <button className="btn primary" onClick={() => setBulkMode(true)}>
                  Bulk resolve
                </button>
              )}
            </div>
          )}
          {activeBets.length === 0 && (
            <div className="empty">No active bets on the board yet.</div>

          {activeBets.map((bet) => (
            <div className="card" key={bet.id}>
              <div className="bet-head">
                <div>
                  <p className="bet-title">{bet.title}</p>
                  {bet.note && <div className="bet-note">{bet.note}</div>}
                  <div className="bet-meta">
                    {bet.season} season{bet.stake ? ` · $${bet.stake} a side` : ""}
                  </div>
                </div>
                <Stamp status="active" />
              </div>
              <div className="sides-row">
                {PEOPLE.map((p) => {
                  const untaken = bet.sides[p].in && isUntakenPick(bet.sides[p].pick);
                  const editing = pickEditingKey === draftKey(bet.id, p);
                  return (
                    <span className={"side-pill" + (bet.sides[p].in ? "" : " skip")} key={p}>
                      <Chip person={p} />
                      {bet.sides[p].in ? bet.sides[p].pick : "sitting out"}

                        <button
                          className="pick-edit-btn"

                    </span>

              </div>
              {PEOPLE.some(
                (p) => pickEditingKey === draftKey(bet.id, p) && bet.sides[p].in

                    <div key={p}>

                          fontFamily: "IBM Plex Mono, monospace",
                          fontSize: 10.5,
                          letterSpacing: 1,
                          textTransform: "uppercase",

                      </label>
                      <input
                        type="text"
                        value={pickDraft}
                        onChange={(e) => setPickDraft(e.target.value)}

                          width: "100%",
                          marginTop: 6,
                          background: "#0A0A0A",
                          border: "1px solid rgba(255,255,255,0.16)",
                          borderRadius: 5,
                          padding: 8,
                          color: "#ECE7DA",
                        }}
                      />
                      <div className="actions-row">
                        <button
                          className="btn primary"
                          disabled={!pickDraft.trim()}
                          onClick={() => saveEditPick(bet.id, p)}

                          Save pick
                        </button>
                        <button className="btn" onClick={() => setPickEditingKey(null)}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

              {bulkMode ? (
                <div className="resolve-panel">
                  {PEOPLE.filter((p) => bet.sides[p].in).map((p) => (
                    <div className="resolve-person" key={p}>
                      <span>
                        <Chip person={p} /> {p} — {bet.sides[p].pick}
                      </span>
                      <div className="outcome-btns">
                        {["win", "loss", "push"].map((o) => (
                          <button
                            key={o}
                            className={bulkDrafts[bet.id]?.[p] === o ? "sel-" + o : ""}
                            onClick={() => setBulkOutcome(bet.id, p, o)}
                          >
                            {o.toUpperCase()}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              ) : resolvingId === bet.id ? (
                <div className="resolve-panel">
                  {Object.keys(resolveDraft).map((p) => (
                    <div className="resolve-person" key={p}>
                      <span>
                        <Chip person={p} /> {p} — {bet.sides[p].pick}
                      </span>
                      <div className="outcome-btns">
                        {["win", "loss", "push"].map((o) => (
                          <button
                            key={o}
                            className={resolveDraft[p] === o ? "sel-" + o : ""}
                            onClick={() => setResolveDraft({ ...resolveDraft, [p]: o })}
                          >
                            {o.toUpperCase()}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                  <div className="actions-row">
                    <button
                      className="btn primary"
                      disabled={Object.values(resolveDraft).some((v) => !v)}
                      onClick={confirmResolve}
                    >
                      Confirm result
                    </button>
                    <button className="btn" onClick={() => setResolvingId(null)}>
                      Cancel
                    </button>
                  </div>
                </div>
              ) : voidingId === bet.id ? (
                <div className="void-panel">
                  <label
                    style={{
                      fontFamily: "IBM Plex Mono, monospace",
                      fontSize: 10.5,
                      letterSpacing: 1,
                      textTransform: "uppercase",
                      color: "#9A9A9A",
                    }}
                  >
                    Reason (e.g. "CMC out 4+ games")
                  </label>
                  <input
                    type="text"
                    value={voidReason}
                    onChange={(e) => setVoidReason(e.target.value)}
                    style={{
                      width: "100%",
                      marginTop: 6,
                      background: "#0A0A0A",
                      border: "1px solid rgba(255,255,255,0.16)",
                      borderRadius: 5,
                      padding: 8,
                      color: "#ECE7DA",
                    }}
                  />
                  <div className="actions-row">
                    <button className="btn danger" onClick={confirmVoid}>
                      Void bet
                    </button>
                    <button className="btn" onClick={() => setVoidingId(null)}>
                      Cancel
                    </button>
                  </div>
                </div>
              ) : (
                <div className="actions-row">
                  <button className="btn primary" onClick={() => openResolve(bet)}>
                    Enter result
                  </button>
                  <button className="btn danger" onClick={() => openVoid(bet.id)}>
                    Void
                  </button>
                </div>
              )}
            </div>
          ))}
          {bulkMode && activeBets.length > 0 && (
            <div
              className="card"
              style={{
                position: "sticky",
                bottom: 12,
                borderColor: "#FFD200",
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                gap: 10,
                flexWrap: "wrap",
              }}
            >
              <span className="bet-note" style={{ margin: 0 }}>
                {activeBets.filter(isBetBulkReady).length} of {activeBets.length} filled in

              <div className="actions-row" style={{ margin: 0 }}>
                <button
                  className="btn primary"
                  disabled={activeBets.filter(isBetBulkReady).length === 0}
                  onClick={saveBulkResults}
                >
                  Save {activeBets.filter(isBetBulkReady).length} result
                  {activeBets.filter(isBetBulkReady).length === 1 ? "" : "s"}
                </button>
                <button className="btn" onClick={exitBulkMode}>
                  Cancel
                </button>
              </div>
            </div>

        </div>

      {tab === "history" && (

                  </tr>

                    {s}

              </select>

              <span className="bet-note"> — no season tagged yet</span>

                  <tr>
                    <th></th>
                    {PEOPLE.map((p) => (
                      <th key={p} style={{ color: PERSON_COLOR[p] }}>
                        {p}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {PEOPLE.map((row) => (
                    <tr key={row}>
                      <th style={{ color: PERSON_COLOR[row] }}>{row}</th>
                      {PEOPLE.map((col) =>
                        row === col ? (
                          <td className="self" key={col}>—</td>
                        ) : (
                          <td key={col}>
                            {standingsSeason[row][col].w}-{standingsSeason[row][col].l}-
                            {standingsSeason[row][col].p}

                    </tr>
                  ))}
                </tbody>
              </table>
            )}
            <div className="bet-note" style={{ marginTop: 10 }}>
              Read as row's record vs. column (W-L-P). Set a "Season" when you add a bet so it rolls up here — most recent one loads by default.
            </div>
          </div>
        </div>

      {tab === "tally" && (
        <div className="card">

            <div className="empty">

            currentTallyLines.map((line, i) => {
              const [ower, , owed, amt] = line.match(/^(.*) owes (.*) \$(.*)$/).slice(1);
              return (
                <div className="tally-line" key={i}>
                  <span>
                    <strong style={{ color: PERSON_COLOR[ower] }}>{ower}</strong> owes{" "}
                    <strong style={{ color: PERSON_COLOR[owed] }}>{owed}</strong>
                  </span>
                  <span className="tally-amt">${amt}</span>
                </div>

            })

          <div className="actions-row">
            {confirmingSettle ? (
              <>
                <button className="btn primary" onClick={settleUp}>
                  Confirm — mark all squared
                </button>
                <button className="btn" onClick={() => setConfirmingSettle(false)}>
                  Cancel
                </button>
              </>
            ) : (
              <button
                className="btn primary"
                disabled={currentTallyLines.length === 0}
                onClick={() => setConfirmingSettle(true)}
              >
                Settle up
              </button>
            )}
          </div>
          <div className="bet-note" style={{ marginTop: 12 }}>

          </div>
          {settlements.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <p className="section-label" style={{ fontSize: 18 }}>
                Past settlements
              </p>
              {settlements.map((s) => (
                <div key={s.id} className="settle-log">
                  {new Date(s.date).toLocaleDateString()} — {s.lines.length ? s.lines.join(", ") : "all square"}
                </div>
              ))}
            </div>
          )}

      {tab === "watchlist" && (
        <div>
          <p className="bet-note" style={{ marginBottom: 12 }}>
            ❄️ Ice = guys you want to fade. 🔥 Fire = guys you're high on and want to back. Use
            these to spot natural bet matchups — check the idea generator on the Propose tab.
          </p>
          <div className="watch-grid">
            {PEOPLE.map((p) => (
              <div className="card" key={p}>

                        {kind === "fire" ? "🔥 Fire — backing" : "❄️ Ice — fading"}

                          onKeyDown={(e) => e.key === "Enter" && addWatch(p, kind)}
                        />

                          Add
                        </button>
                      </div>
                    </div>

                })}
              </div>

              start a bet title. Rankings are snapshotted directly from FantasyPros' half-PPR
              expert consensus rankings as of Aug 12, 2026 — ask to have them refreshed anytime.
            </div>
            {fireIceMatchups.length > 0 && (
              <div className="idea-nearby-list" style={{ marginBottom: 4 }}>
                <div className="bet-meta">Straight from Ice & Fire — someone's high, someone's fading:</div>
                {fireIceMatchups.map((m, i) => (
                  <div className="idea-nearby-row" key={i}>
                    <span>
                      <span className="idea-nearby-name">{m.name}</span>
                      <span className="idea-watch-tag fire">🔥 {m.firePerson}</span>
                      <span className="idea-watch-tag ice">❄️ {m.icePerson}</span>
                    </span>
                    <button className="btn primary" onClick={() => useMatchupIdea(m)}>
                      Start bet
                    </button>
                  </div>
                ))}
              </div>
            )}
            <div className="idea-input-row">
              <input
                type="text"
                list="idea-players"
                placeholder="e.g. Ladd McConkey"
                value={ideaQuery}
                onChange={(e) => setIdeaQuery(e.target.value)}
              />
            </div>
            <datalist id="idea-players">
              {RANKINGS.map((p) => (
                <option key={p.name} value={p.name} />
              ))}
            </datalist>
            {ideaQuery.trim() && !ideaResult && (
              <div className="bet-note" style={{ marginTop: 10 }}>
                No match for "{ideaQuery}" — try the exact spelling, or add a player idea
                manually below.
              </div>
            )}
            {ideaResult && (
              <div className="idea-nearby-list">
                <div className="bet-meta" style={{ marginTop: 8 }}>
                  {ideaResult.target.name} — {ideaResult.target.pos}{ideaResult.target.rank} overall at position
                  {watchTagsFor(ideaResult.target.name).map((t, i) => (
                    <span className={"idea-watch-tag " + t.kind} key={i}>
                      {t.kind === "fire" ? "🔥" : "❄️"} {t.person}
                    </span>
                  ))}
                </div>
                {ideaResult.nearby.map((n) => {
                  const tags = watchTagsFor(n.name);
                  return (
                    <div className="idea-nearby-row" key={n.name}>
                      <span>
                        <span className="idea-nearby-name">{n.name}</span>
                        <span className="idea-nearby-rank">
                          {n.pos}{n.rank} · {n.rank > ideaResult.target.rank ? "+" : ""}
                          {n.rank - ideaResult.target.rank}
                        </span>
                        {tags.map((t, i) => (
                          <span className={"idea-watch-tag " + t.kind} key={i}>
                            {t.kind === "fire" ? "🔥" : "❄️"} {t.person}
                          </span>
                        ))}
                      </span>
                      <button className="btn primary" onClick={() => useIdea(n.name)}>
                        Use vs {n.name.split(" ").slice(-1)[0]}
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
          {proposedBets.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <p className="section-label">Waiting on an answer</p>
              {proposedBets.map((bet) => (
                <div className="card" key={bet.id}>
                  <div className="bet-head">
                    <div>
                      <p className="bet-title">{bet.title}</p>
                      {bet.note && <div className="bet-note">{bet.note}</div>}
                      <div className="bet-meta">
                        Proposed by {bet.createdBy} · {bet.season} season
                      </div>
                    </div>
                    <Stamp status="proposed" />
                  </div>
                  <div className="sides-row">
                    {PEOPLE.map((p) => (
                      <span className={"side-pill" + (bet.sides[p].in ? "" : " skip")} key={p}>
                        <Chip person={p} />
                        {bet.sides[p].in ? bet.sides[p].pick : "sitting out"}
                        {bet.sides[p].in && (
                          <span
                            className="outcome-tag"
                            style={
                              bet.sides[p].accepted
                                ? { background: "rgba(111,207,122,0.18)", color: "#6FCF7A" }
                                : { background: "rgba(255,210,0,0.15)", color: "#FFD200" }
                            }
                          >
                            {bet.sides[p].accepted ? "in" : "waiting"}
                          </span>
                        )}
                      </span>
                    ))}
                  </div>
                  <div className="accept-list">
                  {PEOPLE.filter((p) => bet.sides[p].in && !bet.sides[p].accepted).map((p) => (
                    <div className="accept-row" key={p}>
                      <Chip person={p} />
                      <input
                        type="text"
                        placeholder={`${p}'s pick`}
                        value={getAcceptDraft(bet, p)}
                        onChange={(e) => setAcceptDraft(bet.id, p, e.target.value)}
                      />
                      <button
                        className="btn primary"
                        disabled={!getAcceptDraft(bet, p).trim()}
                        onClick={() => accept(bet.id, p)}
                      >
                        Accept
                      </button>
                      <button className="btn danger" onClick={() => decline(bet.id, p)}>
                        Decline
                      </button>
                    </div>
                  ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          <p className="section-label">New bet</p>
          <div className="card form-grid">
          <label>Bet</label>
          <input
            type="text"
            placeholder='e.g. "CMC vs Bijan — most PPR points wk 12"'
            value={form.title}
            onChange={(e) => setForm({ ...form, title: e.target.value })}
          />
          <label>Note (optional)</label>
          <textarea
            placeholder="Any extra context, void conditions, etc."
            value={form.note}
            onChange={(e) => setForm({ ...form, note: e.target.value })}
          />
          <div className="two-col">
            <div>
              <label>Season</label>
              <div className="season-locked">{form.season} (current)</div>
            </div>
            <div>
              <label>Stake, $ a side</label>
              <input
                type="number"
                placeholder="1"
                value={form.stake}
                onChange={(e) => setForm({ ...form, stake: e.target.value })}
              />
            </div>
          </div>
          <label>Type</label>
          <div className="mode-toggle">
            <button
              className={form.mode === "log" ? "on" : ""}
              onClick={() => setForm({ ...form, mode: "log" })}
            >
              Already agreed — log it
            </button>
            <button
              className={form.mode === "propose" ? "on" : ""}
              onClick={() => setForm({ ...form, mode: "propose" })}
            >
              Propose — needs acceptance
            </button>
          </div>
          {form.mode === "propose" && (
            <>
              <label>Proposed by</label>
              <select
                value={form.proposer}
                onChange={(e) => setForm({ ...form, proposer: e.target.value })}
              >
                {PEOPLE.map((p) => (
                  <option key={p}>{p}</option>
                ))}
              </select>
            </>
          )}
          <label>Sides</label>
          {PEOPLE.map((p) => (
            <div className="person-row" key={p}>
              <Chip person={p} />
              <strong style={{ width: 62, fontSize: 13 }}>{p}</strong>
              {form.sides[p].in ? (
                <input
                  type="text"
                  placeholder={
                    form.mode === "propose" && p !== form.proposer
                      ? "optional — they'll set this when they accept"
                      : "their pick / position on the bet"
                  }
                  value={form.sides[p].pick}
                  onChange={(e) =>
                    setForm({
                      ...form,
                      sides: { ...form.sides, [p]: { ...form.sides[p], pick: e.target.value } },
                    })
                  }
                />
              ) : (
                <span style={{ flex: 1, color: "#5A5A5A", fontSize: 12.5 }}>sitting this one out</span>
              )}
              <span
                className={"skip-toggle" + (!form.sides[p].in ? " active" : "")}
                onClick={() =>
                  setForm({
                    ...form,
                    sides: { ...form.sides, [p]: { ...form.sides[p], in: !form.sides[p].in } },
                  })
                }
              >
                {form.sides[p].in ? "Skip" : "Back in"}
              </span>
            </div>
          ))}
          <div className="submit-row">
            <button
              className="btn primary"
              disabled={!form.title.trim() || PEOPLE.filter((p) => form.sides[p].in).length < 2}
              onClick={submitBet}
            >
              {form.mode === "log" ? "Add to board" : "Send proposal"}
            </button>
          </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BoardBetTracker />);
</script>
</body>
</html>
